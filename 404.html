<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Karen Albertini</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0f2e" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b0f2e'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='Georgia,serif' font-size='62' fill='%23c9b3ff'%3EK%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f2e;
        --card-border: rgba(196, 170, 255, 0.16);
        --text: #ece9ff;
        --muted: #a9a6cf;
        --purple: #9b6dff;
        --lavender: #c9b3ff;
        --blue: #3b4cca;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.65;
        text-align: center;
        overflow-x: hidden;
      }

      .glow {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
      }

      .glow span {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.45;
      }

      .glow span:nth-child(1) {
        width: 480px;
        height: 480px;
        background: var(--purple);
        top: -180px;
        right: -140px;
      }

      .glow span:nth-child(2) {
        width: 420px;
        height: 420px;
        background: var(--blue);
        bottom: -180px;
        left: -140px;
      }

      main {
        max-width: 560px;
      }

      .gear {
        width: 150px;
        height: 150px;
        margin: 0 auto 8px;
        animation: stutter 6s ease-in-out infinite;
        filter: drop-shadow(0 0 30px rgba(155, 109, 255, 0.35));
      }

      /* turns, gets stuck on the missing tooth, wobbles, tries again */
      @keyframes stutter {
        0% {
          transform: rotate(0deg);
        }
        55% {
          transform: rotate(150deg);
        }
        60% {
          transform: rotate(142deg);
        }
        65% {
          transform: rotate(150deg);
        }
        70% {
          transform: rotate(145deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      .code {
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(4.5rem, 18vw, 7rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.03em;
        background: linear-gradient(100deg, var(--lavender), var(--purple));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.4rem, 4vw, 1.9rem);
        line-height: 1.3;
        margin: 0 0 6px;
        transition: opacity 0.25s;
      }

      h1:lang(ja) {
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      }

      .translation {
        font-size: 0.92rem;
        font-style: italic;
        color: var(--lavender);
        margin: 0;
        transition: opacity 0.25s;
      }

      .fading {
        opacity: 0;
      }

      /* keeps the buttons from jumping when the phrase changes length */
      .phrase-box {
        min-height: 6.4em;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 14px 0 16px;
      }

      p {
        color: var(--muted);
        margin: 0 0 32px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        padding: 13px 26px;
        border-radius: 999px;
        font: inherit;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s;
      }

      .btn-primary {
        border: 0;
        background: linear-gradient(120deg, #7c4dff, var(--purple));
        color: #fff;
        box-shadow: 0 10px 30px -10px rgba(155, 109, 255, 0.8);
      }

      .btn-ghost {
        border: 1px solid var(--card-border);
        background: transparent;
        color: var(--lavender);
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-ghost:hover {
        background: rgba(201, 179, 255, 0.08);
      }

      @media (prefers-reduced-motion: reduce) {
        .gear {
          animation: none;
        }

        h1,
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"><span></span><span></span></div>

    <main>
      <!-- a gear with one tooth missing -->
      <svg class="gear" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c9b3ff" />
            <stop offset="0.6" stop-color="#9b6dff" />
            <stop offset="1" stop-color="#3b4cca" />
          </linearGradient>
        </defs>
        <g fill="url(#g1)">
          <circle cx="100" cy="100" r="68" />
          <g id="teeth"><rect x="88" y="10" width="24" height="30" rx="5" /></g>
          <use href="#teeth" transform="rotate(30 100 100)" />
          <use href="#teeth" transform="rotate(60 100 100)" />
          <use href="#teeth" transform="rotate(90 100 100)" />
          <use href="#teeth" transform="rotate(120 100 100)" />
          <use href="#teeth" transform="rotate(150 100 100)" />
          <use href="#teeth" transform="rotate(180 100 100)" />
          <use href="#teeth" transform="rotate(240 100 100)" />
          <use href="#teeth" transform="rotate(270 100 100)" />
          <use href="#teeth" transform="rotate(300 100 100)" />
          <use href="#teeth" transform="rotate(330 100 100)" />
        </g>
        <circle cx="100" cy="100" r="40" fill="#0b0f2e" />
      </svg>

      <div class="code">404</div>
      <div class="phrase-box">
        <h1 id="phrase" aria-live="polite">This page failed its tolerance check.</h1>
        <div id="translation" class="translation"></div>
      </div>
      <p>The page you're looking for doesn't exist — or it's still somewhere in the CAD model.</p>

      <div class="buttons">
        <a href="/" class="btn btn-primary">Back to the homepage</a>
        <button type="button" id="another" class="btn btn-ghost">Give me another excuse</button>
      </div>
    </main>

    <script>
      // lang + an English translation for the French and Japanese lines
      const phrases = [
        { text: "This page failed its tolerance check." },
        { text: "We ran the tests. This page did not pass." },
        { text: "This page exceeded its yield strength." },
        { text: "Measured twice, cut once — and it's still missing." },
        { text: "Part number not found in the bill of materials." },
        { text: "The valve to this page seems to be closed." },
        { text: "This page is still in the CAD model and never made it to production." },
        { text: "Someone forgot to tighten this page's screws." },
        { text: "This page went into the CNC machine and came out as chips." },
        { text: "Error 404 — in French, Japanese, German and English." },
        { text: "Even a seam ripper can't fix this one." },
        { text: "This page is currently being optimised. Indefinitely." },
        { text: "Have you tried turning it off and on again?" },
        { text: "This gear is missing a tooth. So is this page." },
        { text: "Oups ! Cette page est partie en pause café.", lang: "fr", note: "Oops! This page went on a coffee break." },
        { text: "Il manque une vis quelque part.", lang: "fr", note: "There's a screw missing somewhere." },
        { text: "Cette page n'existe pas. Enfin… pas encore.", lang: "fr", note: "This page doesn't exist. Well… not yet." },
        { text: "Houston, on a un problème.", lang: "fr", note: "Houston, we have a problem." },
        { text: "C'est en forgeant qu'on devient forgeron.", lang: "fr", note: "Practice makes perfect — this page is still practising." },
        { text: "このページは迷子になりました。", lang: "ja", note: "This page got lost." },
        { text: "猿も木から落ちる。", lang: "ja", note: "Even monkeys fall from trees." },
        { text: "ネジが一本足りないようです。", lang: "ja", note: "Looks like we're one screw short." },
        { text: "このページは只今カイゼン中です。", lang: "ja", note: "This page is currently undergoing kaizen." },
        { text: "七転び八起き。", lang: "ja", note: "Fall down seven times, get up eight." },
      ];

      const phrase = document.getElementById("phrase");
      const translation = document.getElementById("translation");
      let current = Math.floor(Math.random() * phrases.length);

      function show(index) {
        const { text, lang = "en", note = "" } = phrases[index];
        phrase.textContent = text;
        phrase.lang = lang;
        translation.textContent = note;
      }

      show(current);

      document.getElementById("another").addEventListener("click", () => {
        let next;
        do {
          next = Math.floor(Math.random() * phrases.length);
        } while (next === current);
        current = next;

        phrase.classList.add("fading");
        translation.classList.add("fading");
        setTimeout(() => {
          show(current);
          phrase.classList.remove("fading");
          translation.classList.remove("fading");
        }, 250);
      });
    </script>
  </body>
</html>
